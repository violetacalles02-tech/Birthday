<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concurso de Tapas MMXXVI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============ COLORES Y FUENTES (cámbialos aquí) ============ */
  :root {
    --fondo-a: #bbfaff;
    --fondo-b: #cdf8b4;
    --fondo-c: #f6ffcd;
    --acento1: #e8548f;   /* rosa */
    --acento2: #f29a2e;   /* naranja */
    --acento3: #2f8fd0;   /* azul */
    --texto: #3b1d4f;
    --tarjeta: rgba(255, 255, 255, .78);
    --borde: rgba(232, 84, 143, .22);
    --fuente-titulo: 'Fraunces', Georgia, serif;
    --fuente-texto: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--fuente-texto);
    color: var(--texto);
    background: linear-gradient(160deg, var(--fondo-a), var(--fondo-b) 55%, var(--fondo-c)) fixed;
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.55;
  }

  /* Puntitos de colores de fondo */
  .estrellas {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(3px 3px at 20% 30%, #e8548f44, transparent),
      radial-gradient(2px 2px at 70% 20%, #f29a2e55, transparent),
      radial-gradient(3px 3px at 40% 80%, #2f8fd044, transparent),
      radial-gradient(2px 2px at 85% 65%, #e8548f44, transparent),
      radial-gradient(2px 2px at 10% 70%, #f29a2e55, transparent),
      radial-gradient(3px 3px at 55% 50%, #2f8fd044, transparent);
    animation: titilar 4s ease-in-out infinite alternate;
  }
  @keyframes titilar { from { opacity: .4; } to { opacity: 1; } }

  /* Globos flotando */
  .globo {
    position: fixed; bottom: -120px; width: 46px; height: 58px;
    border-radius: 50% 50% 48% 48%; opacity: .6; z-index: 0; pointer-events: none;
    animation: subir linear infinite;
  }
  .globo::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    width: 1px; height: 50px; background: #3b1d4f44;
  }
  @keyframes subir {
    to { transform: translateY(-125vh) translateX(30px) rotate(8deg); }
  }

  main { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 20px 80px; }
  #sorteo, #detalles, footer { max-width: 880px; margin-left: auto; margin-right: auto; }

  /* ---------- HERO: foto | texto | foto ---------- */
  .hero {
    min-height: 100vh; padding: 40px 0;
    display: grid; align-items: center; gap: 14px 28px;
    grid-template-columns: minmax(150px, 1.2fr) minmax(0, 1.6fr) minmax(150px, 1.2fr);
    grid-template-areas: "izq arriba der" "izq abajo der";
  }
  .arriba, .abajo { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .arriba { grid-area: arriba; align-self: end; }
  .abajo { grid-area: abajo; align-self: start; }
  .eyebrow { letter-spacing: .3em; text-transform: uppercase; font-size: .8rem; color: var(--acento2); font-weight: 600; }
  .concurso {
    font-family: var(--fuente-titulo); font-style: italic; font-weight: 500;
    font-size: clamp(2.3rem, 8.5vw, 4rem); line-height: 1.08; color: var(--acento1);
    white-space: pre-line;   /* respeta el salto de línea del CONFIG */
  }
  .adorno { color: var(--acento2); letter-spacing: .6em; font-size: .9rem; }
  .nombres {
    font-family: var(--fuente-titulo); font-weight: 600;
    font-size: clamp(2.2rem, 7vw, 4.2rem); line-height: 1.05;
    background: linear-gradient(90deg, var(--acento1), var(--acento2), var(--acento3), var(--acento1));
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: brillo 7s linear infinite;
  }
  @keyframes brillo { to { background-position: 200% center; } }
  .subtitulo { font-size: 1.1rem; max-width: 34ch; opacity: .85; }
  .flecha { margin-top: 10px; font-size: 1.6rem; animation: rebote 1.6s ease-in-out infinite; opacity: .6; text-decoration: none; color: inherit; }
  @keyframes rebote { 50% { transform: translateY(8px); } }

  /* Fotos */
  .foto.izq { grid-area: izq; }
  .foto.der { grid-area: der; }
  .foto { text-align: center; }
  .marco {
    aspect-ratio: 3 / 4; width: 100%; max-width: 320px; margin: 0 auto;
    border-radius: 22px; overflow: hidden;
    border: 2px solid var(--acento1); box-shadow: 0 16px 38px rgba(120, 40, 100, .25);
    transform: rotate(-3deg); transition: transform .4s;
    background: #fff;
  }
  .foto.der .marco { transform: rotate(3deg); }
  .foto:hover .marco { transform: rotate(0) scale(1.03); }
  .marco img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto figcaption { margin-top: 14px; font-family: var(--fuente-titulo); font-style: italic; font-size: 1.15rem; }

  /* ---------- CUENTA ATRÁS ---------- */
  .cuenta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 18px 0 4px; }
  .cuenta div {
    background: var(--tarjeta); border: 1px solid var(--borde); backdrop-filter: blur(8px);
    border-radius: 18px; padding: 14px 10px; min-width: 72px; text-align: center;
    box-shadow: 0 6px 18px rgba(120, 40, 100, .08);
  }
  .cuenta b { display: block; font-family: var(--fuente-titulo); font-size: 1.9rem; color: var(--acento1); }
  .cuenta span { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; opacity: .7; }

  /* ---------- TARJETAS ---------- */
  h2 { font-family: var(--fuente-titulo); font-size: clamp(1.8rem, 5vw, 2.6rem); text-align: center; margin: 70px 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .tarjeta {
    background: var(--tarjeta); border: 1px solid var(--borde); backdrop-filter: blur(8px);
    border-radius: 22px; padding: 26px 22px; text-align: center;
    box-shadow: 0 8px 22px rgba(120, 40, 100, .08);
    transition: transform .3s, border-color .3s;
  }
  .tarjeta:hover { transform: translateY(-6px) rotate(-.6deg); border-color: var(--acento1); }
  .tarjeta .emoji { font-size: 2.2rem; display: block; margin-bottom: 8px; }
  .tarjeta h3 { font-family: var(--fuente-titulo); font-size: 1.25rem; margin-bottom: 6px; color: var(--acento1); }
  .tarjeta a { color: var(--acento3); font-weight: 500; }

  .mensaje { text-align: center; max-width: 52ch; margin: 0 auto; font-size: 1.1rem; opacity: .9; }

  /* ---------- SORTEO ---------- */
  #sorteo { margin-top: 10px; }
  .sorteo-caja {
    background: var(--tarjeta); border: 2px dashed var(--acento1); backdrop-filter: blur(8px);
    border-radius: 30px; padding: 38px 24px 34px; text-align: center;
    box-shadow: 0 12px 30px rgba(120, 40, 100, .1);
  }
  .sorteo-emoji { font-size: 2.6rem; display: block; }
  .sorteo-caja h2 { margin: 8px 0 14px; }
  .sorteo-caja .botones { margin-top: 24px; }

  /* ---------- BOTONES ---------- */
  .botones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
  .btn {
    font: 600 1rem var(--fuente-texto); cursor: pointer; text-decoration: none; border: 0;
    padding: 14px 26px; border-radius: 999px; color: #fff;
    background: linear-gradient(90deg, var(--acento1), var(--acento2));
    box-shadow: 0 8px 24px rgba(232, 84, 143, .35); transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 30px rgba(232, 84, 143, .5); }
  .btn.secundario { background: rgba(255,255,255,.7); color: var(--texto); border: 1.5px solid var(--borde); box-shadow: none; }

  footer { text-align: center; opacity: .6; margin-top: 70px; font-size: .9rem; }

  /* Aparecer al hacer scroll */
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s, transform .8s; }
  .reveal.visible { opacity: 1; transform: none; }

  canvas#confeti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  /* ---------- SOBRE DE ENTRADA ---------- */
  body.bloqueado { overflow: hidden; }
  .sobre-overlay {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; overflow: hidden;
    background: linear-gradient(160deg, var(--fondo-a), var(--fondo-b) 55%, var(--fondo-c));
    transition: opacity .9s ease, transform .9s ease;
  }
  .sobre-overlay.saliendo { opacity: 0; transform: scale(1.12); pointer-events: none; }
  .sobre-escena { --w: min(84vw, 400px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .sobre-de { letter-spacing: .28em; text-transform: uppercase; font-size: .75rem; color: var(--acento2); font-weight: 600; }
  .sobre-titulo { font-family: var(--fuente-titulo); font-style: italic; font-size: clamp(1.7rem, 7vw, 2.4rem); color: var(--acento1); line-height: 1.12; }
  .sobre {
    position: relative; width: var(--w); height: calc(var(--w) * .66); perspective: 900px;
    margin: calc(var(--w) * .4) 0 18px;      /* hueco arriba para que la solapa y la carta tengan sitio al abrirse */
  }
  .sobre-fondo { position: absolute; inset: 0; background: #f3b6d1; border-radius: 10px; box-shadow: 0 22px 44px rgba(120, 40, 100, .28); }
  .sobre-carta {
    position: absolute; left: 6%; right: 6%; top: 6%; bottom: 6%; z-index: 2; background: #fff; border-radius: 8px;
    border: 1.5px solid var(--borde); box-shadow: 0 -2px 10px rgba(120, 40, 100, .12);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: .45em; padding: 7% 4% 4%;
    font-size: calc(var(--w) * .052); transition: transform 1.2s cubic-bezier(.3, .9, .3, 1);
  }
  .c-eyebrow { letter-spacing: .25em; text-transform: uppercase; font-size: .62em; color: var(--acento2); font-weight: 600; }
  .c-titulo { font-family: var(--fuente-titulo); font-style: italic; font-size: 1.35em; color: var(--acento1); white-space: pre-line; line-height: 1.1; }
  .c-adorno { color: var(--acento2); letter-spacing: .5em; font-size: .7em; }
  .sobre-frente { position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: 10px; overflow: hidden; }
  .sobre-frente svg, .sobre-tapa svg { width: 100%; height: 100%; display: block; }
  .sobre-tapa {
    position: absolute; left: 0; top: 0; width: 100%; height: 56%; z-index: 4; transform-origin: top center;
    transition: transform .9s cubic-bezier(.4, .1, .3, 1); filter: drop-shadow(0 4px 4px rgba(120, 40, 100, .18));
  }
  .sello {
    position: absolute; left: 50%; top: 56%; z-index: 6; transform: translate(-50%, -50%);
    width: calc(var(--w) * .2); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
    font: 600 calc(var(--w) * .058) var(--fuente-titulo); letter-spacing: .02em;
    background: radial-gradient(circle at 35% 30%, #ff8fc0, #e8548f 65%, #c93f78);
    box-shadow: 0 6px 14px rgba(120, 40, 100, .4), inset 0 -3px 6px rgba(0, 0, 0, .15);
    animation: latido 1.8s ease-in-out infinite; transition: opacity .3s, scale .3s;
  }
  @keyframes latido { 50% { box-shadow: 0 0 0 10px rgba(232, 84, 143, .18), 0 6px 14px rgba(120, 40, 100, .4); } }
  .sobre.abierto .sello { opacity: 0; scale: .4; pointer-events: none; }
  .sobre.abierto .sobre-tapa { transform: rotateX(180deg); z-index: 1; transition: transform .9s cubic-bezier(.4, .1, .3, 1), z-index 0s .45s; }
  .sobre.carta-fuera .sobre-carta { transform: translateY(-62%); }
  .sobre-nota { font-size: .9rem; opacity: .8; min-height: 1.4em; }

  .musica-btn {
    position: fixed; right: 16px; bottom: 16px; z-index: 40; width: 48px; height: 48px; border-radius: 50%;
    border: 1.5px solid var(--borde); background: rgba(255, 255, 255, .88); backdrop-filter: blur(6px);
    font-size: 1.3rem; cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(120, 40, 100, .2);
  }

  /* Móvil: fotos arriba lado a lado, texto debajo */
  @media (max-width: 820px) {
    .hero {
      grid-template-columns: 1fr 1fr; gap: 22px 14px; padding-top: 30px;
      grid-template-areas: "arriba arriba" "izq der" "abajo abajo";
    }
    .arriba, .abajo { align-self: auto; }
    .marco { max-width: 100%; border-width: 2px; }
    .foto figcaption { font-size: 1rem; margin-top: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>

<body>
<div class="estrellas"></div>
<canvas id="confeti"></canvas>

<!-- Sobre de entrada: lo primero que se ve al abrir el enlace -->
<div class="sobre-overlay" id="sobre" role="dialog" aria-label="Invitación">
  <div class="sobre-escena">
    <p class="sobre-de" id="sobreDe"></p>
    <h1 class="sobre-titulo" id="sobreTitulo"></h1>
    <div class="sobre" id="sobreObj">
      <div class="sobre-fondo"></div>
      <div class="sobre-carta">
        <span class="c-eyebrow" id="cartaEyebrow"></span>
        <span class="c-titulo" id="cartaTitulo"></span>
        <span class="c-adorno">✦ ✦ ✦</span>
      </div>
      <div class="sobre-frente">
        <svg viewBox="0 0 400 264" preserveAspectRatio="none" aria-hidden="true">
          <polygon points="0,0 200,148 0,264" fill="#f7c7dd"/>
          <polygon points="400,0 200,148 400,264" fill="#f7c7dd"/>
          <polygon points="0,264 200,148 400,264" fill="#f9d9e8"/>
          <polyline points="0,0 200,148 400,0" fill="none" stroke="rgba(232,84,143,.25)" stroke-width="1.5"/>
          <polyline points="0,264 200,148 400,264" fill="none" stroke="rgba(232,84,143,.25)" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="sobre-tapa">
        <svg viewBox="0 0 400 148" preserveAspectRatio="none" aria-hidden="true">
          <polygon points="0,0 400,0 200,148" fill="#f1a3c6" stroke="rgba(232,84,143,.35)" stroke-width="1.5"/>
        </svg>
      </div>
      <button class="sello" id="sello" type="button" aria-label="Abrir el sobre"></button>
    </div>
    <button class="btn" id="btnAbrir" type="button"></button>
    <p class="sobre-nota" id="sobreNota"></p>
  </div>
</div>
<button class="musica-btn" id="btnMusica" type="button" aria-label="Activar o silenciar la música" hidden>🔊</button>

<main>
  <section class="hero">
    <figure class="foto izq">
      <div class="marco"><img id="fotoIzq" alt=""></div>
      <figcaption id="capIzq"></figcaption>
    </figure>

    <div class="arriba">
      <p class="eyebrow" id="eyebrow"></p>
      <p class="concurso" id="concurso"></p>
      <p class="adorno">✦ ✦ ✦</p>
    </div>

    <div class="abajo">
      <h1 class="nombres" id="nombres"></h1>
      <p class="subtitulo" id="subtitulo"></p>
      <div class="cuenta" id="cuenta"></div>
      <a class="flecha" href="#sorteo" aria-label="Ver detalles">↓</a>
    </div>

    <figure class="foto der">
      <div class="marco"><img id="fotoDer" alt=""></div>
      <figcaption id="capDer"></figcaption>
    </figure>
  </section>

  <section id="sorteo">
    <div class="sorteo-caja reveal">
      <span class="sorteo-emoji">🌍🥘</span>
      <h2 id="sorteoTitulo"></h2>
      <p class="mensaje" id="sorteoTexto"></p>
      <div class="botones">
        <a class="btn" id="btnSorteo" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </section>

  <section id="detalles">
    <h2 class="reveal">Los detalles</h2>
    <div class="grid" id="tarjetas"></div>

    <h2 class="reveal">Gracias por ser parte de nuestro año :) </h2>
    <p class="mensaje reveal" id="mensaje"></p>

    <div class="botones reveal">
      <a class="btn" id="btnRsvp" target="_blank" rel="noopener">¡Confirmo mi asistencia! 🎉</a>
      <button class="btn secundario" id="btnCal">📅 Añadir al calendario</button>
    </div>
    <p class="mensaje reveal" id="limite" style="margin-top:18px;font-size:.95rem"></p>
  </section>

  <footer id="pie"></footer>
</main>

<script>
/* =====================================================
   CONFIGURACIÓN: cambia aquí todos los textos y datos
   ===================================================== */
const CONFIG = {
  eyebrow: "Estás invitada al",
  concurso: "Concurso de Tapas\nMMXXVI Edition",   // \n = salto de línea. MMXXVI = 2026
  nombres: ["Reyes", "Violeta"],                   // sale como "Reyes & Violeta's Birthday"
  subtitulo: "",                                   // déjalo vacío si no quieres frase bajo el título

  // Sobre de entrada (lo primero que ven al abrir el enlace) y música
  sobre: true,                                     // false = sin sobre, la invitación se ve directamente
  sobreTitulo: "Tienes una invitación",
  sobreBoton: "Pulsa para abrir el sobre ✉️",
  sobreNota: "🔊 Sube el volumen: con sonido es mejor",
  sobreSello: "",                                  // texto del sello; vacío = las iniciales (R&V)
  musica: "musica.mp3",                            // archivo de audio junto a este HTML ("" = sin música)
  musicaVolumen: 0.6,                              // de 0 (mudo) a 1 (máximo)

  // Fotos: pon aquí el nombre del archivo (en la misma carpeta que este HTML).
  // Ejemplo: fotoIzq: "reyes.jpg". Si lo dejas vacío, se ve una imagen de ejemplo.
  fotoIzq: "reyes_chef.jpeg",
  fotoDer: "vio_chef.jpeg",

  fecha: "2026-11-07T19:30:00",               // formato AAAA-MM-DDTHH:MM:SS
  duracionHoras: 5,                           // para el evento del calendario

  // Apartado del sorteo (debajo de la portada)
  sorteoTitulo: "El sorteo de nacionalidades",
  sorteoTexto: "Cada pareja recibirá una nacionalidad al azar y tendrá que preparar una tapa de ese país. ¡Descubrid cuál os toca!",
  sorteoBoton: "🎲 Ir al sorteo",
  sorteoUrl: "sorteo.html",

  lugar: "Casa Vio",
  direccion: "Calle Comunidad de Castilla y Leon 130, Madrid",
  mapsUrl: "https://www.google.com/maps/place/C.+Comunidad+Castilla-Le%C3%B3n,+130,+28231+Las+Rozas+de+Madrid,+Madrid/@40.4987694,-3.8757129,15z/data=!4m6!3m5!1s0xd41836223b2cd21:0x78430f639854ab4c!8m2!3d40.4897431!4d-3.8805265!16s%2Fg%2F11csdq4nz7?authuser=0&entry=ttu&g_ep=EgoyMDI2MTAxOC4wIKXMDSoASAFQAw%3D%3D",

  dressCode: "Casual chic ✨  es broma venid como queráis 😎",
  extra: "Habrá bebidas, música y picoteo. Avisa si tienes alguna alergia.",

  pie: "Hecho con cariño 💜"
};

/* ===================== Código (puedes tocarlo si quieres) ===================== */
const $ = id => document.getElementById(id);
const fecha = new Date(CONFIG.fecha);

// Textos de portada
$("eyebrow").textContent = CONFIG.eyebrow;
$("concurso").textContent = CONFIG.concurso;
$("nombres").textContent = `${CONFIG.nombres[0]} & ${CONFIG.nombres[1]}'s Birthday`;
$("subtitulo").textContent = CONFIG.subtitulo;
if (!CONFIG.subtitulo) $("subtitulo").style.display = "none";
$("mensaje").textContent = CONFIG.mensaje;
$("limite").textContent = CONFIG.fechaLimite;
$("pie").textContent = CONFIG.pie;
$("sorteoTitulo").textContent = CONFIG.sorteoTitulo;
$("sorteoTexto").textContent = CONFIG.sorteoTexto;
$("btnSorteo").textContent = CONFIG.sorteoBoton;
$("btnSorteo").href = CONFIG.sorteoUrl;
document.title = `${CONFIG.concurso.replace("\n", " ")} · ${CONFIG.nombres.join(" & ")}`;

// Fotos (con imagen de ejemplo si no hay)
function placeholder(c1, c2) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect width="300" height="400" fill="url(#g)"/>
    <text x="150" y="44" font-family="Georgia,serif" font-size="18" text-anchor="middle" fill="#fff">Tu foto aquí</text>
    <g fill="#fff"><circle cx="112" cy="125" r="38"/><circle cx="150" cy="108" r="44"/><circle cx="188" cy="125" r="38"/><rect x="112" y="125" width="76" height="52" rx="6"/></g>
    <circle cx="150" cy="238" r="58" fill="#ffe3cf"/>
    <circle cx="131" cy="232" r="6" fill="#4a2a3a"/><circle cx="169" cy="232" r="6" fill="#4a2a3a"/>
    <path d="M131 256 Q150 274 169 256" stroke="#4a2a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M60 400 Q150 295 240 400Z" fill="#fff"/>
    <rect x="128" y="320" width="44" height="12" rx="6" fill="#fff" opacity="0"/>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
$("fotoIzq").src = CONFIG.fotoIzq || placeholder("#e8548f", "#f29a2e");
$("fotoDer").src = CONFIG.fotoDer || placeholder("#2f8fd0", "#b794f6");
$("fotoIzq").alt = `${CONFIG.nombres[0]} vestida de chef`;
$("fotoDer").alt = `${CONFIG.nombres[1]} vestida de chef`;
$("capIzq").textContent = CONFIG.nombres[0];
$("capDer").textContent = CONFIG.nombres[1];

// Tarjetas
const fechaTxt = fecha.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
const horaTxt = fecha.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
const tarjetas = [
  { emoji: "🗓️", titulo: "Cuándo", html: `${fechaTxt}<br>a las ${horaTxt}` },
  { emoji: "📍", titulo: "Dónde", html: `${CONFIG.lugar}<br>${CONFIG.direccion}<br><a href="${CONFIG.mapsUrl}" target="_blank" rel="noopener">Ver en el mapa</a>` },
  { emoji: "👗", titulo: "Dress code", html: CONFIG.dressCode },
  { emoji: "🎂", titulo: "Ojo con esto", html: CONFIG.extra },
];
$("tarjetas").innerHTML = tarjetas.map(t =>
  `<div class="tarjeta reveal"><span class="emoji">${t.emoji}</span><h3>${t.titulo}</h3><p>${t.html}</p></div>`
).join("");

// WhatsApp
$("btnRsvp").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(CONFIG.textoWhatsapp)}`;

// Cuenta atrás
function actualizarCuenta() {
  const falta = fecha - new Date();
  if (falta <= 0) { $("cuenta").innerHTML = "<p class='subtitulo'>¡Hoy es el gran día! 🎉</p>"; return; }
  const d = Math.floor(falta / 864e5), h = Math.floor(falta / 36e5) % 24,
        m = Math.floor(falta / 6e4) % 60, s = Math.floor(falta / 1e3) % 60;
  $("cuenta").innerHTML = [[d, "días"], [h, "horas"], [m, "min"], [s, "seg"]]
    .map(([n, l]) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l}</span></div>`).join("");
}
actualizarCuenta(); setInterval(actualizarCuenta, 1000);

// Añadir al calendario (.ics)
$("btnCal").addEventListener("click", () => {
  const f = d => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const fin = new Date(fecha.getTime() + CONFIG.duracionHoras * 36e5);
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT",
    `DTSTART:${f(fecha)}`, `DTEND:${f(fin)}`,
    `SUMMARY:${CONFIG.concurso.replace("\n", " ")} - cumpleaños de ${CONFIG.nombres.join(" y ")}`,
    `LOCATION:${CONFIG.lugar}, ${CONFIG.direccion}`,
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = "cumpleanos.ics"; a.click();
});

// Aparecer al hacer scroll
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("visible")), { threshold: .15 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

// Globos
const colores = ["#e8548f", "#f29a2e", "#2f8fd0", "#9b6bdc", "#38b57a"];
for (let i = 0; i < 9; i++) {
  const g = document.createElement("div");
  g.className = "globo";
  g.style.left = Math.random() * 95 + "vw";
  g.style.background = colores[i % colores.length];
  g.style.animationDuration = 14 + Math.random() * 14 + "s";
  g.style.animationDelay = -Math.random() * 20 + "s";
  document.body.appendChild(g);
}

// Confeti
const cv = $("confeti"), cx = cv.getContext("2d");
let piezas = [];
const ajustar = () => { cv.width = innerWidth; cv.height = innerHeight; };
ajustar(); addEventListener("resize", ajustar);

function lanzarConfeti(x = innerWidth / 2, y = innerHeight / 3, n = 140) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
    piezas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: colores[Math.floor(Math.random() * colores.length)], vida: 140 + Math.random() * 60 });
  }
}
(function bucle() {
  cx.clearRect(0, 0, cv.width, cv.height);
  piezas = piezas.filter(p => p.vida-- > 0);
  piezas.forEach(p => {
    p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.globalAlpha = Math.min(1, p.vida / 40);
    cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  });
  requestAnimationFrame(bucle);
})();

addEventListener("click", e => lanzarConfeti(e.clientX, e.clientY, 60));

/* ---------- Sobre de entrada + música ---------- */
const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
let audio = null;

function iniciarMusica() {                      // se llama al pulsar: los navegadores solo dejan sonar tras un clic
  if (!CONFIG.musica) return;
  audio = new Audio(CONFIG.musica);
  audio.loop = true; audio.volume = 0;
  audio.addEventListener("error", () => { audio = null; $("btnMusica").hidden = true; });
  audio.play().then(() => {
    $("btnMusica").hidden = false;
    const meta = Math.min(1, Math.max(0, CONFIG.musicaVolumen)); let v = 0;   // el volumen sube poco a poco
    const id = setInterval(() => {
      if (!audio) return clearInterval(id);
      v = Math.min(meta, v + meta / 20); audio.volume = v;
      if (v >= meta) clearInterval(id);
    }, 100);
  }).catch(() => { audio = null; });
}
$("btnMusica").addEventListener("click", e => {
  e.stopPropagation();                          // sin confeti al pulsar este botón
  if (!audio) return;
  if (audio.paused) { audio.play(); $("btnMusica").textContent = "🔊"; }
  else { audio.pause(); $("btnMusica").textContent = "🔇"; }
});

function empezarFiesta() { if (!reducido) setTimeout(() => lanzarConfeti(), 600); }

if (!CONFIG.sobre || location.hash === "#sinsobre") {      // abre la web con #sinsobre al final para saltarte el sobre
  $("sobre").remove();
  empezarFiesta();
} else {
  document.body.classList.add("bloqueado");
  const iniciales = CONFIG.nombres.map(n => n.trim()[0].toUpperCase()).join("&");
  $("sobreDe").textContent = "De " + CONFIG.nombres.join(" & ");
  $("sobreTitulo").textContent = CONFIG.sobreTitulo;
  $("cartaEyebrow").textContent = CONFIG.eyebrow;
  $("cartaTitulo").textContent = CONFIG.concurso;
  $("sello").textContent = CONFIG.sobreSello || iniciales;
  $("btnAbrir").textContent = CONFIG.sobreBoton;
  $("sobreNota").textContent = CONFIG.musica ? CONFIG.sobreNota : "";

  let abierto = false;
  function abrirSobre() {
    if (abierto) return; abierto = true;
    $("btnAbrir").disabled = true;
    iniciarMusica();
    const sobre = $("sobreObj"), ov = $("sobre"), k = reducido ? 0.2 : 1;
    sobre.classList.add("abierto");                                        // 1) se abre la solapa
    setTimeout(() => sobre.classList.add("carta-fuera"), 800 * k);         // 2) sube la carta
    setTimeout(() => {                                                     // 3) el sobre se desvanece y estalla el confeti
      ov.classList.add("saliendo");
      document.body.classList.remove("bloqueado");
      lanzarConfeti(innerWidth / 2, innerHeight / 2, 220);
      setTimeout(() => lanzarConfeti(innerWidth * .2, innerHeight * .4, 90), 250);
      setTimeout(() => lanzarConfeti(innerWidth * .8, innerHeight * .4, 90), 450);
    }, 2700 * k);
    setTimeout(() => ov.remove(), 3800 * k);
  }
  $("sello").addEventListener("click", abrirSobre);
  $("btnAbrir").addEventListener("click", abrirSobre);
}
</script>
